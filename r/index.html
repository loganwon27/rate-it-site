<script>
  // Share links look like /r/?p=<code>; the app shows them at /#/r/<code>.
  var code = new URLSearchParams(location.search).get('p') || '';
  location.replace('/#/r/' + encodeURIComponent(code.replace(/[^A-Za-z0-9]/g, '')));
</script>
