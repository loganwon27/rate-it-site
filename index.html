<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090a">
  <script>
    // Appearance (Settings): dark unless this browser picked light or system. Set before anything draws.
    try {
      var a = localStorage.getItem('appearance');
      if (a === 'light' || a === 'system') {
        document.documentElement.dataset.theme = a;
        if (a === 'light' || matchMedia('(prefers-color-scheme: light)').matches) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4f6');
        }
      }
    } catch (e) {}
  </script>
  <meta name="description" content="Post anything. See what people think. Rate photos 1–10 and see how everyone voted.">
  <title>Rate It</title>
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "preact": "./vendor/preact.mjs", "preact/hooks": "./vendor/hooks.mjs", "htm": "./vendor/htm.mjs" } }
  </script>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Rate It needs JavaScript turned on.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
